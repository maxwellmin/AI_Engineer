[tool.poetry]
name = "melonmind"
version = "0.1.0"
description = "Django backend with LangChain/LangGraph agents and Mulves knowledge base for network engineering operations"
authors = ["stttt2003pk@gmail.com"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
django = "^5.1"
djangorestframework = "^3.15.0"
djangorestframework-simplejwt = "^5.3.0"
django-rest-knox = "^5.0.0"
langchain = "^1.2.8"
langchain-core = "^1.2.8"
langchain-community = "^0.3.0"
langgraph = "^1.0.7"
# mulves 依赖需要根据实际包名调整
# mulves = "^1.0.0"
psycopg2-binary = "^2.9.7"
python-dotenv = "^1.0.0"
django-cors-headers = "^4.3.0"
celery = "^5.3.0"
redis = "^4.6.0"
setuptools = "<79"
asyncpg = "^0.29.0"  # PostgreSQL异步驱动，用于MulvesDB连接
drf-yasg = "^1.21.14"
pymilvus = "^2.6.8"
django-filter = "^25.2"
pypdf = "^5.0.0"  # PDF parsing (successor to pypdf2)
python-docx = "^1.1.0"  # DOCX parsing
chardet = "^5.2.0"  # Encoding detection for text files
openai = "^2.16.0"
langchain-text-splitters = "^1.1.0"
# 添加连接池和监控相关依赖
sqlalchemy = "^2.0.0"  # 数据库工具包
timeout-decorator = "^0.5.0"  # 超时控制装饰器
retry = "^0.9.2"  # 重试机制
ipdb = "^0.13.13"
boto3 = "^1.34"  # AWS SDK for Python (S3 client for MinIO/AWS S3)
httpx = {extras = ["socks"], version = "^0.28.1"}
neo4j = "^5.0"  # Neo4j Python Driver for graph database operations


[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-django = "^4.5.0"
black = "^23.7.0"
flake8 = "^6.0.0"
mypy = "^1.4.0"
pytest-asyncio = ">=0.21.0,<1.0.0"
ipython = "^9.10.0"
# 添加数据库调试和性能监控工具
pytest-cov = "^4.1.0"  # 代码覆盖率测试
django-debug-toolbar = "^4.2.0"  # Django调试工具栏
factory-boy = "^3.3.0"  # 测试数据工厂
moto = { version = "^5.0", extras = ["s3"] }  # Mock S3 for testing


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# =============================================================================
# pytest Configuration
# =============================================================================

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
]

# =============================================================================
# Coverage Configuration
# =============================================================================

[tool.coverage.run]
source = ["apps", "core"]
branch = true
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
fail_under = 80

# =============================================================================
# Black Configuration
# =============================================================================

[tool.black]
line-length = 120
target-version = ["py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | migrations
)/
'''

# =============================================================================
# isort Configuration
# =============================================================================

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["apps", "core", "config"]
known_third_party = ["django", "rest_framework", "celery", "langchain"]
skip = [".venv", "migrations"]

# =============================================================================
# mypy Configuration
# =============================================================================

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["mypy_django_plugin.main"]

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "redis.*",
    "pymilvus.*",
    "drf_yasg.*",
]
ignore_missing_imports = true